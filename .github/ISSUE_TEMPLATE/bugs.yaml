name: 我发现了 Bug
description: 点击此项使用杀虫剂
title: '[Bug?]: '
labels: [ "Bug?" ]
assignees: [ "daizihan233" ]
type: bug
projects: ['AstraSchedule/1']

body:
  - type: markdown
    attributes:
      value: |
        ## 感谢您愿意花一些时间来填写这个内容！
        ## 以下是一些注意事项，能让提交更快被处理

        ### ❗ | 确定没有相同提议的 ISSUE 已被提出。
        ### ❔ | 提议时，如果文字无法说明清楚，不妨使用画图的方法辅助说明
        ### ⚠ | 如果涉及敏感信息，请自行打码

        ## 如果您不知道如何有效、精准地表述，这里有一些文档供您参考
        [《提问指南》](https://lug.ustc.edu.cn/wiki/doc/howtoask/)
        [《提问的智慧》](https://lug.ustc.edu.cn/wiki/doc/smart-questions/)
        [《别像弱智一样提问》](https://github.com/tangx/Stop-Ask-Questions-The-Stupid-Ways/blob/master/README.md)

        如果您第一次提问，建议您从较为简洁现代的《提问指南》读起；尚有余力想要进一步优化问题表述的可以阅读更加详细的《提问的智慧》；如果您更偏好于简短、幽默的文风也不妨读一读《别像弱智一样提问》。

        不过，您也不必为此感到压力，[更好地回答问题](https://lug.ustc.edu.cn/wiki/doc/smart-questions/#%E5%A6%82%E4%BD%95%E6%9B%B4%E5%A5%BD%E5%9C%B0%E5%9B%9E%E7%AD%94%E9%97%AE%E9%A2%98) 也是一个高尚的开发者需要具备的品德，我们都曾是新手。

        ---
  - type: checkboxes
    id: terms
    attributes:
      label: |
        请确保您已阅读以上注意事项，并勾选下方的确认框。
      options:
        - label: "我已经仔细阅读上述注意事项，并能够尝试运用其中任一文档所述的提问技巧。"
          required: true
        - label: "我确定这不是因为操作失误而引起的问题。"
          required: true
        - label: "我确定这是一个有意义的提问，且目前似乎没有可能的解决方案。"
          required: true
        - label: "我确定在最新版本中仍未修复"
          required: true
        - label: "我愿意为此问题提交 Pull Request，或者提供一些排查思路（非必选）"
          required: false

  - type: markdown
    attributes:
      value: |
        接下来我们将引导您详细地描述您所遇到的问题

        ## 相关信息
        请根据实际使用环境修改以下信息。

  - type: dropdown
    id: config-type
    attributes:
      label: 您使用的配置文件类别是？
      description: 选择配置文件的获取方式
      options:
        - SaaS
        - 自部署
        - 本地文件（即将废弃！）
    validations:
      required: true

  - type: textarea
    id: config-file
    attributes:
      label: 云端链接
      description: |
        如果您使用 SaaS，则提供您的子域名，比如 abc.getastra.cn；如果您使用子部署，提供您填入客户端的链接，比如 http://10.13.0.233:9000；如果您使用本地文件，则粘贴您的本地配置文件。
    validations:
      required: true

  - type: dropdown
    id: problem-type
    attributes:
      label: 您反馈的问题属于以下哪个功能？
      description: 如果您确实不知道属于什么，可以选择：“我不确定”
      options:
        - 课表显示
        - 云端配置
        - 当前日期
        - 倒数日期
        - 实时天气
        - 插件系统
        - 自动调休
        - 其他错误
        - 我不确定
    validations:
      required: true

  - type: dropdown
    id: question-type
    attributes:
      label: 您反馈的问题属于以下哪个类别？
      description: 如果您确实不知道属于什么，可以选择 “我不确定”
      options:
        - 功能异常
        - 弹窗报错
        - 无法生效
        - 我不确定
    validations:
      required: true

  - type: dropdown
    id: part-type
    attributes:
      label: 您反馈的问题属于以下哪个部分？
      description: 如果您确实不知道属于什么，可以选择 “我不确定”
      multiple: true
      options:
        - 客户端（desktop）
        - 管理端（usr-dashboard）
        - 服务端（usr-backend）
        - 文档站（docs-site）
        - 注册站前端（reg-go）
        - 注册站后端（reg-to）
        - 系统仪表盘（sys-dashboard）
        - 系统管理端（sys-backend）
        - 我不确定
    validations:
      required: true

  # Input | Reproduce
  - type: textarea
    id: reproduce-steps
    attributes:
      label: 重现步骤
      description: |
        我需要执行哪些操作才能让 bug 出现？
        简洁清晰的重现步骤能够帮助更迅速地定位问题所在。
    validations:
      required: true

  # Input | Expected result
  - type: textarea
    id: expected
    attributes:
      label: 期望的结果是什么？
    validations:
      required: true

  # Input | Actual result
  - type: textarea
    id: actual
    attributes:
      label: 实际的结果是什么？
    validations:
      required: true


  # Optional | Extra description
  - type: textarea
    id: extra-desc
    attributes:
      label: 补充说明（可选）
