name: Rolling Build & Publish

on:
  push:
    branches:
      - main

jobs:
  # 版本号只在这里计算一次，经 job output 提供给两个矩阵任务共用。
  # 若各任务各自 Get-Date：跨午夜/月末或失败重跑时两次算出的日期不同，
  # 两个通道会发布到不同的 release，而 electron-updater 只读最新 release，
  # 导致其中一个通道找不到元数据、更新失败（CodeRabbit 意见 #1）。
  version:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.compute.outputs.ver }}
    steps:
      - id: compute
        name: Compute rolling version
        run: |
          # 语义化版本：YYYYMM.D.N（均为数字且无前导零）
          ym=$(date -u +%Y%m)
          dd=$(date -u +%-d)
          echo "ver=${ym}.${dd}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # 两个通道并行构建并上传 OSS。此前串行（max-parallel: 1）只是为了避免并发
  # 创建 GitHub release 的竞争；现在 GitHub release 不再由 electron-builder 在
  # 构建中发布（改为 --publish never，发布统一挪到 publish_release 闸门），
  # 竞争源头消除，两条构建线放心并行，CI 时间约省一半。
  build_and_publish:
    name: Build & Upload OSS (${{ matrix.channel }})
    needs: version
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    runs-on: windows-latest
    # OSS 上传失败时无限重试；6 小时是 GHA 单 job 硬上限，作为最终兜底——
    # 超时则本 job 变红，publish_release 不会执行，宁可不发 Release。
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # 默认通道：旧版 Electron（最后支持 Win7/8 的 22.x）、ia32，元数据文件 latest.yml
          - channel: win7
            electron: "22.3.27"
            arch: ia32
            channel_file: "latest.yml"
            setup_artifact: "AstraSchedule-Setup-${version}.${ext}"
            portable_artifact: "AstraSchedule-Portable-${version}.${ext}"
            installer_alias: "AstraScheduleInstaller.exe"
            artifact_name: "dist-windows-win7"
          # Win10+ 通道：新版本 Electron（已不再提供 win32-ia32，故用 x64），元数据文件 win10.yml
          - channel: win10
            electron: "latest"
            arch: x64
            channel_file: "win10.yml"
            setup_artifact: "AstraSchedule-Setup-Win10-${version}.${ext}"
            portable_artifact: "AstraSchedule-Portable-Win10-${version}.${ext}"
            installer_alias: "AstraScheduleInstallerWin10.exe"
            artifact_name: "dist-windows-win10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up VS
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 'latest'

      - name: Prepare package.json (rolling version / electron / artifact names / channel)
        shell: pwsh
        run: |
          # 语义化版本：YYYYMM.D.N，由 version 任务统一计算（见 needs.version.outputs.ver），
          # 保证两个通道在任何情况下都拿到同一个版本号、发布到同一个 release
          $ver = '${{ needs.version.outputs.ver }}'

          # Win10+ 通道动态取 npm 上的最新稳定版 Electron；Win7 通道固定 22.x
          $electron = '${{ matrix.electron }}'
          if ($electron -eq 'latest') {
            $electron = (npm view electron version).Trim()
            Write-Host "Resolved latest stable Electron: $electron"
          }

          $pkgPath = "package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg.devDependencies.electron = "^$electron"
          # 分叉构建：两个通道的安装包命名必须区分，否则安装包会互相覆盖
          $pkg.build.nsis.artifactName = '${{ matrix.setup_artifact }}'
          $pkg.build.portable.artifactName = '${{ matrix.portable_artifact }}'

          # 分叉构建：两个通道共用同一个 release 与版本号，只靠元数据文件名区分。
          # Win10+ 通道写 win10.yml，默认通道保持 latest.yml。
          # 即使 GitHub 发布已挪到 publish_release，这段配置仍必须保留：
          # publish 配置决定 electron-builder 是否生成 latest.yml/win10.yml 元数据及其内容。
          $pub = $pkg.build.publish[0]
          if ('${{ matrix.channel }}' -eq 'win10') {
            $pub | Add-Member -NotePropertyName channel -NotePropertyValue 'win10' -Force
          } else {
            $pub.PSObject.Properties.Remove('channel')
          }

          $pkg | ConvertTo-Json -Depth 100 | Out-File -Encoding UTF8 $pkgPath

          Write-Host "Channel: ${{ matrix.channel }} | Version: $ver | Electron: $electron | Metadata: ${{ matrix.channel_file }}"
          Get-Content $pkgPath

      - name: Install dependencies
        run: bun install

      # 只构建、只产出元数据，不发布 GitHub release：release 由 publish_release
      # 闸门在两条 OSS 上传全部成功并通过一致性校验后统一创建，见文件底部。
      - name: Build installers (GitHub publish deferred to release gate)
        shell: pwsh
        run: |
          bun x electron-builder --win --${{ matrix.arch }} --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy NSIS installer alias
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -File | Where-Object { $_.Name -like "*-Setup-*.exe" } | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "dist/${{ matrix.installer_alias }}"
            Write-Host "Copied $($installer.Name) -> dist/${{ matrix.installer_alias }}"
          } else {
            Write-Error "No NSIS installer found"
            exit 1
          }

      - name: Upload dist to OSS (infinite retry)
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_SECRET_KEY }}
          AWS_DEFAULT_REGION: cn-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $channelFile = '${{ matrix.channel_file }}'

          $installer = Get-ChildItem -Path dist -File | Where-Object { $_.Name -like "*-Setup-*.exe" } | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not found."; exit 1 }

          $yml = Get-ChildItem -Path dist -File | Where-Object { $_.Name -eq $channelFile } | Select-Object -First 1
          if (-not $yml) { Write-Error "$channelFile not found."; exit 1 }

          # OSS 偶发 5xx / 网络抖动不再让整条发布半途而废：无限重试 + 线性退避（单次最长 120s）。
          # 兜底是 job 的 timeout-minutes（6 小时）：超时任务变红，publish_release 不执行，
          # 宁可不发 Release，也不发没有 OSS 镜像的 Release。
          function Push-OSS([string]$local, [string]$key) {
            $attempt = 0
            while ($true) {
              $attempt++
              Write-Host "Uploading $key (attempt $attempt)"
              aws s3 cp $local "s3://yanmo-objects/$key" --endpoint-url "https://cn-nb1.rains3.com"
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Uploaded $key on attempt $attempt"
                return
              }
              $delay = [Math]::Min(120, 10 * $attempt)
              Write-Warning "上传 $key 失败（exit $LASTEXITCODE），$delay 秒后重试（无限重试，不中断）"
              Start-Sleep -Seconds $delay
            }
          }

          Write-Host "Uploading version: $ver (channel: ${{ matrix.channel }})"

          # 按版本归档（latest.yml 与 win10.yml 都在同一目录）
          Push-OSS $installer.FullName "AstraSchedule/$ver/$($installer.Name)"
          Push-OSS $yml.FullName "AstraSchedule/$ver/$channelFile"

          # 稳定 latest 目录：作为可选的 generic 更新源，两个通道的 yml 与安装包都维护在这里
          Push-OSS $installer.FullName "AstraSchedule/latest/$($installer.Name)"
          Push-OSS $yml.FullName "AstraSchedule/latest/$channelFile"

          # 差量更新（electron-updater 的 blockmap 差分）要求安装包旁边有同名 .blockmap：
          # 少了它，每次更新都会差量失败、回落到全量下载（Win10 通道约 128MB）。
          $blockmap = Get-ChildItem -Path dist -File | Where-Object { $_.Name -eq ($installer.Name + '.blockmap') } | Select-Object -First 1
          $blockmapArchived = $false
          if ($blockmap) {
            Push-OSS $blockmap.FullName "AstraSchedule/$ver/$($blockmap.Name)"
            $blockmapArchived = $true
          } else {
            Write-Warning "未找到 $($installer.Name).blockmap：本次发布的差量更新将不可用"
          }
          if ($blockmapArchived) {
            Push-OSS $blockmap.FullName "AstraSchedule/latest/$($blockmap.Name)"
          }

          # 别名（官网/注册中心的固定下载链接用的就是这个名字）：hubproxy 关停后由 ESA
          # 重定向按文件名映射到这里，缺了它那些旧链接会 404
          $aliasPath = "dist/${{ matrix.installer_alias }}"
          if (-not (Test-Path $aliasPath)) { Write-Error "Installer alias not found: $aliasPath"; exit 1 }
          Push-OSS $aliasPath "AstraSchedule/$ver/${{ matrix.installer_alias }}"
          Push-OSS $aliasPath "AstraSchedule/latest/${{ matrix.installer_alias }}"

          Write-Host "OSS upload completed: AstraSchedule/$ver/"

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/**
          if-no-files-found: warn

  # latest/ 目录必须只保留当前版本的产物：残留的旧安装包与旧 latest.yml/win10.yml
  # 会让客户端读到「元数据声明的版本 ≠ 安装包实际版本」的更新源，出现装完版本不变、
  # 反复下载安装的循环重启（见 #58）。两个通道都成功后才执行，避免只清一半、
  # 造成两份 yml 版本不一致。用 pwsh 与仓库其它步骤保持一致。
  prune_oss_latest:
    name: Verify & prune OSS latest/
    needs: [version, build_and_publish]
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    runs-on: windows-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_SECRET_KEY }}
      AWS_DEFAULT_REGION: cn-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      ENDPOINT: https://cn-nb1.rains3.com
      BUCKET: yanmo-objects
      PREFIX: AstraSchedule/latest/
    steps:
      # 一致性闸门：两个通道的元数据都必须声明本次版本，否则宁可红，
      # 也不能让客户端从自相矛盾的更新源里循环安装。
      - name: Verify both channels report the current version
        shell: pwsh
        run: |
          $ver = '${{ needs.version.outputs.ver }}'
          foreach ($f in @('latest.yml', 'win10.yml')) {
            $key = "$env:PREFIX$f"
            $out = Join-Path $env:RUNNER_TEMP $f
            aws s3api get-object --bucket $env:BUCKET --key $key --endpoint-url $env:ENDPOINT $out | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "读取 $key 失败"; exit $LASTEXITCODE }
            $got = ((Select-String -Path $out -Pattern '^version:\s*(.+)$' | Select-Object -First 1).Matches.Groups[1].Value).Trim()
            if ($got -ne $ver) {
              Write-Error "::error::$key 声明版本 $got，与本次发布 $ver 不一致"
              exit 1
            }
            Write-Host "OK: $f -> $ver"
          }

      - name: Delete objects that are not part of this version
        shell: pwsh
        run: |
          $ver = '${{ needs.version.outputs.ver }}'
          # 注意：PS 里逗号优先级高于 +，必须先把前缀拼进变量，否则数组会被拆散
          $prefix = $env:PREFIX
          $keep = @(
            "${prefix}latest.yml",
            "${prefix}win10.yml",
            "${prefix}AstraSchedule-Setup-$ver.exe",
            "${prefix}AstraSchedule-Setup-$ver.exe.blockmap",
            "${prefix}AstraSchedule-Setup-Win10-$ver.exe",
            "${prefix}AstraSchedule-Setup-Win10-$ver.exe.blockmap",
            "${prefix}AstraScheduleInstaller.exe",
            "${prefix}AstraScheduleInstallerWin10.exe"
          )

          $listed = aws s3api list-objects-v2 --bucket $env:BUCKET --prefix $env:PREFIX --endpoint-url $env:ENDPOINT --query 'Contents[].Key' --output text
          if ($LASTEXITCODE -ne 0) { Write-Error '列出 latest/ 对象失败'; exit $LASTEXITCODE }
          $keys = @($listed -split '\s+') | Where-Object { $_ -and $_ -ne 'None' }

          Write-Host "Current version: $ver"
          foreach ($key in $keys) {
            # 只清理发布产物，目录里的其它对象（图标、说明等）不动
            if ($key -notmatch '\.(exe|yml|blockmap)$') { Write-Host "keep (not a release artifact): $key"; continue }
            if ($keep -contains $key) { Write-Host "keep: $key"; continue }
            Write-Host "delete: $key"
            aws s3 rm "s3://$env:BUCKET/$key" --endpoint-url $env:ENDPOINT
            if ($LASTEXITCODE -ne 0) { Write-Error "删除 $key 失败"; exit $LASTEXITCODE }
          }
          Write-Host "OSS $env:PREFIX 现在只保留 $ver 的产物"

  # 发布闸门：两个通道都完成「构建 + OSS 无限重试上传」，且 prune_oss_latest 的
  # 版本一致性校验通过后，才创建 GitHub Release 并上传全部产物（安装包 / 便携版 /
  # 别名 / 元数据 yml / blockmap）。任何时刻公开的 Release 背后必有完整 OSS 镜像，
  # 不再出现「发了 Release 却没有 OSS Mirror」的半发布。
  # 产物文件名与 electron-builder 原生成计划一致，latest.yml/win10.yml 内指向
  # GitHub release 下载地址的 URL 依然有效。
  publish_release:
    name: Publish GitHub Release
    needs: [version, build_and_publish, prune_oss_latest]
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download win7 dist
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-win7
          path: dist-win7

      - name: Download win10 dist
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-win10
          path: dist-win10

      - name: Create or update release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver='${{ needs.version.outputs.ver }}'
          tag="v$ver"
          shopt -s nullglob
          # 只取发布产物（exe/yml/blockmap），win-*-unpacked/ 里的 electron.exe 等中间物不进 release；
          # 不依赖 upload-artifact 是否保留 dist/ 前缀，递归查找但剪掉 unpacked 目录
          files=($(find dist-win7 dist-win10 \( -name 'win-*-unpacked' -o -name 'win-unpacked' \) -prune -o -type f \( -name '*.exe' -o -name 'latest.yml' -o -name 'win10.yml' -o -name '*.blockmap' \) -print | sort))
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有可发布的产物"
            exit 1
          fi
          echo "Publishing ${#files[@]} artifacts to $tag:"
          printf '  %s\n' "${files[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 失败重跑时 release 可能已存在：--clobber 覆盖上传保持幂等
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --notes "Rolling build $ver（OSS 镜像已同步）"
          fi
