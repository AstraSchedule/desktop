name: Rolling Build & Publish

on:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    if: ${{ !startsWith(github.event.head_commit.message, 'docs') }}
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up VS
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 'latest'

      - name: Install dependencies
        run: bun install

      - name: Compute rolling version and write to package.json
        shell: pwsh
        run: |
          # 语义化版本：YYYYMM.D.N（均为数字且无前导零）
          $ym  = [int](Get-Date -Format 'yyyyMM')
          $dd  = [int](Get-Date -Format 'dd')
          $run = [int]${{ github.run_number }}
          $ver = "$ym.$dd.$run"
          Write-Host "Rolling version: $ver"
          $pkgPath = "package.json"
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 100 | Out-File -Encoding UTF8 $pkgPath
          Get-Content $pkgPath

      - name: Build and publish to GitHub Releases (rolling)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run ci

      - name: Copy NSIS installer as AstraScheduleInstaller.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*-Setup-*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName -Destination "dist/AstraScheduleInstaller.exe"
            Write-Host "Copied $($installer.Name) -> dist/AstraScheduleInstaller.exe"
            $ver = (Get-Content package.json | ConvertFrom-Json).version
            gh release upload "v$ver" dist/AstraScheduleInstaller.exe --clobber
          } else {
            Write-Host "No NSIS installer found"
          }

      - name: Upload dist to OSS
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OSS_SECRET_KEY }}
          AWS_DEFAULT_REGION: cn-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version

          Write-Host "Uploading version: $ver"

          # 查找 NSIS 安装包
          $installer = Get-ChildItem -Path dist -Filter "*-Setup-*.exe" | Select-Object -First 1

          if (-not $installer) {
            Write-Error "NSIS installer not found."
            exit 1
          }

          # 上传 Setup.exe
          aws s3 cp `
            $installer.FullName `
            "s3://yanmo-objects/AstraSchedule/$ver/$($installer.Name)" `
            --endpoint-url "https://cn-nb1.rains3.com"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to upload installer."
            exit $LASTEXITCODE
          }

          # 上传 latest.yml
          $latest = Get-ChildItem -Path dist -Filter "latest.yml" | Select-Object -First 1

          if (-not $latest) {
            Write-Error "latest.yml not found."
            exit 1
          }

          aws s3 cp `
            $latest.FullName `
            "s3://yanmo-objects/AstraSchedule/$ver/latest.yml" `
            --endpoint-url "https://cn-nb1.rains3.com"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to upload latest.yml."
            exit $LASTEXITCODE
          }

          Write-Host "OSS upload completed: AstraSchedule/$ver/"

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/**
          if-no-files-found: warn
